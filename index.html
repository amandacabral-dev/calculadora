
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora — Java - Spring Boot</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="calculadora">
        <h1>Calculadora</h1>

        <div class="visor">0</div>

        <div class="botoes">
            <button class="operador" data-acao="limpar">AC</button>
            <button class="operador" data-acao="apagar">⌫</button>
            <button class="operador" data-operacao="dividir">÷</button>
            <button class="operador" data-operacao="multiplicar">×</button>

            <button data-numero="7">7</button>
            <button data-numero="8">8</button>
            <button data-numero="9">9</button>
            <button class="operador" data-operacao="subtrair">−</button>

            <button data-numero="4">4</button>
            <button data-numero="5">5</button>
            <button data-numero="6">6</button>
            <button class="operador" data-operacao="somar">+</button>

            <button data-numero="1">1</button>
            <button data-numero="2">2</button>
            <button data-numero="3">3</button>
            <button class="zero" data-numero="0">0</button>

            <button data-numero=".">,</button>
            <button class="operador igual" data-acao="calcular">=</button>
        </div>
    </main>


    </main>

    <footer class="creditos">
        <div class="creditos-titulo">Desenvolvido por:</div>

        <p class="creditos-nomes">
            Amanda Cabral · Lintsen Lopes · Thais Bettin
        </p>

        <div class="creditos-rodape">
            Desenvolvimento Web · Professor Luis Felipe
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>


    <script src="script.js"></script>
</body>
</html>
